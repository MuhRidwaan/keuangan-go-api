<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan API — Documentation Hub</title>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-card: rgba(31, 41, 55, 0.6);
            --bg-hover: rgba(55, 65, 81, 0.5);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --get-color: #10b981;
            --post-color: #3b82f6;
            --put-color: #f59e0b;
            --delete-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            margin-top: 16px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .nav-category {
            margin-bottom: 20px;
        }

        .category-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 6px 12px;
            margin-bottom: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--bg-hover);
            color: #fff;
        }

        .nav-item.active {
            border-left: 3px solid var(--accent-primary);
        }

        .badge-method {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-family: 'Fira Code', monospace;
        }

        .badge-get { background: rgba(16, 185, 129, 0.15); color: var(--get-color); }
        .badge-post { background: rgba(59, 130, 246, 0.15); color: var(--post-color); }
        .badge-put { background: rgba(245, 158, 11, 0.15); color: var(--put-color); }
        .badge-delete { background: rgba(239, 68, 68, 0.15); color: var(--delete-color); }

        /* Main Content */
        .main-content {
            margin-left: 320px;
            flex: 1;
            padding: 40px;
            max-width: 1100px;
        }

        .header-banner {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(168, 85, 247, 0.08));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .header-banner h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header-banner p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
        }

        .base-url-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
        }

        .doc-section {
            margin-bottom: 48px;
        }

        .doc-section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .api-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 24px;
            backdrop-filter: blur(8px);
            transition: border-color 0.2s ease, transform 0.2s ease;
            overflow: hidden;
        }

        .api-card:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }

        .api-card-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.4);
            border-bottom: 1px solid var(--border-color);
        }

        .api-card-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .endpoint-path {
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .api-name {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge-protected {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .api-card-body {
            padding: 24px;
        }

        .api-desc {
            color: #d1d5db;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .grid-blocks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-blocks { grid-template-columns: 1fr; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; padding: 20px; }
            body { flex-direction: column; }
        }

        .code-block-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .code-block-header {
            padding: 10px 14px;
            background: rgba(30, 41, 59, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        pre code {
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            color: #e2e8f0;
            padding: 16px;
            display: block;
            overflow-x: auto;
            line-height: 1.6;
        }

        /* Method Badge Big */
        .method-lg {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .loading-spinner {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
        }

        /* Key Syntax Color */
        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fca5a5; }
        .json-boolean { color: #fde047; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-title">
                <i data-lucide="wallet"></i> Keuangan API
            </div>
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Cari endpoint / kata kunci..." onkeyup="filterDocs()">
            </div>
        </div>

        <nav class="sidebar-nav" id="sidebarNav">
            <!-- Dynamically Rendered -->
            <div class="loading-spinner">Memuat navigasi...</div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header-banner">
            <h1>API Documentation</h1>
            <p>Dokumentasi resmi dan panduan pengujian interaktif untuk seluruh REST API layanan Keuangan.</p>
            <div class="base-url-box">
                <i data-lucide="server" style="width:16px;height:16px;color:#a855f7;"></i>
                <span>Base URL: <strong id="baseUrlText">http://localhost:8080</strong></span>
            </div>
        </div>

        <div id="docsContent">
            <div class="loading-spinner">
                <i data-lucide="loader" style="animation: spin 1s linear infinite; width: 32px; height: 32px; margin-bottom: 12px;"></i>
                <p>Sedang mengambil data dokumentasi dari database PostgreSQL...</p>
            </div>
        </div>
    </main>

    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>

    <script>
        let allDocsData = [];

        async function fetchDocs() {
            try {
                const res = await fetch('/api/docs');
                const json = await res.json();
                if (json.meta && json.meta.code === 200) {
                    allDocsData = json.data || [];
                    renderSidebar(allDocsData);
                    renderContent(allDocsData);
                } else {
                    showError("Gagal mengambil data dokumentasi.");
                }
            } catch (err) {
                showError("Gagal terhubung ke server Go backend.");
            }
        }

        function renderSidebar(docs) {
            const nav = document.getElementById('sidebarNav');
            const categories = [...new Set(docs.map(d => d.category))];
            
            let html = '';
            categories.forEach(cat => {
                const catDocs = docs.filter(d => d.category === cat);
                html += `<div class="nav-category">
                    <div class="category-label">${cat}</div>`;
                
                catDocs.forEach(doc => {
                    const badgeClass = `badge-${doc.method.toLowerCase()}`;
                    html += `
                        <a class="nav-item" href="#doc-${doc.id}">
                            <span class="badge-method ${badgeClass}">${doc.method}</span>
                            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${doc.name}</span>
                        </a>
                    `;
                });
                html += `</div>`;
            });

            nav.innerHTML = html;
            lucide.createIcons();
        }

        function renderContent(docs) {
            const container = document.getElementById('docsContent');
            if (docs.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">Tidak ada data dokumentasi ditemukan.</p>';
                return;
            }

            const categories = [...new Set(docs.map(d => d.category))];
            let html = '';

            categories.forEach(cat => {
                const catDocs = docs.filter(d => d.category === cat);
                html += `<section class="doc-section">
                    <h2 class="doc-section-title">
                        <i data-lucide="folder" style="color:var(--accent-primary)"></i> ${cat}
                    </h2>`;

                catDocs.forEach(doc => {
                    const badgeClass = `badge-${doc.method.toLowerCase()}`;
                    const reqBodyFormatted = doc.request_body ? formatJSON(doc.request_body) : null;
                    const resSuccessFormatted = doc.response_success ? formatJSON(doc.response_success) : null;
                    const resErrorFormatted = doc.response_error ? formatJSON(doc.response_error) : null;

                    html += `
                        <div class="api-card" id="doc-${doc.id}">
                            <div class="api-card-header">
                                <div class="api-card-title">
                                    <span class="badge-method method-lg ${badgeClass}">${doc.method}</span>
                                    <span class="endpoint-path">${doc.endpoint}</span>
                                    <span class="api-name">• ${doc.name}</span>
                                </div>
                                ${doc.is_protected ? `
                                    <span class="badge-protected">
                                        <i data-lucide="lock" style="width:12px;height:12px"></i> Bearer Auth
                                    </span>
                                ` : ''}
                            </div>
                            <div class="api-card-body">
                                <p class="api-desc">${doc.description || ''}</p>
                                
                                <div class="grid-blocks">
                                    <!-- Request -->
                                    <div class="code-block-container">
                                        <div class="code-block-header">
                                            <span>Request Payload / Headers</span>
                                            ${reqBodyFormatted ? `<button class="copy-btn" onclick="copyText('${escapeHtml(doc.request_body)}')"><i data-lucide="copy" style="width:12px"></i> Copy</button>` : ''}
                                        </div>
                                        <pre><code>${reqBodyFormatted ? highlightJSON(reqBodyFormatted) : '<span style="color:var(--text-muted)">Tidak membutuhkan Request Body</span>'}</code></pre>
                                    </div>

                                    <!-- Response Success -->
                                    <div class="code-block-container">
                                        <div class="code-block-header">
                                            <span style="color:var(--get-color)">Response Success (200/201)</span>
                                            ${resSuccessFormatted ? `<button class="copy-btn" onclick="copyText('${escapeHtml(doc.response_success)}')"><i data-lucide="copy" style="width:12px"></i> Copy</button>` : ''}
                                        </div>
                                        <pre><code>${resSuccessFormatted ? highlightJSON(resSuccessFormatted) : '<span style="color:var(--text-muted)">-</span>'}</code></pre>
                                    </div>
                                </div>

                                ${resErrorFormatted ? `
                                    <div class="code-block-container" style="margin-top:16px;">
                                        <div class="code-block-header">
                                            <span style="color:var(--delete-color)">Response Error (400/401/403/409)</span>
                                        </div>
                                        <pre><code>${highlightJSON(resErrorFormatted)}</code></pre>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                html += `</section>`;
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        function formatJSON(jsonObj) {
            try {
                if (typeof jsonObj === 'string') jsonObj = JSON.parse(jsonObj);
                return JSON.stringify(jsonObj, null, 2);
            } catch (e) {
                return String(jsonObj);
            }
        }

        function highlightJSON(jsonStr) {
            return jsonStr.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-boolean';
                }
                return `<span class="${cls}">${match}</span>`;
            });
        }

        function filterDocs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allDocsData.filter(d => 
                d.name.toLowerCase().includes(query) ||
                d.endpoint.toLowerCase().includes(query) ||
                d.category.toLowerCase().includes(query) ||
                d.method.toLowerCase().includes(query)
            );
            renderSidebar(filtered);
            renderContent(filtered);
        }

        function copyText(str) {
            try {
                const formatted = JSON.stringify(JSON.parse(str), null, 2);
                navigator.clipboard.writeText(formatted);
                alert("Copied to clipboard!");
            } catch(e) {
                navigator.clipboard.writeText(str);
                alert("Copied to clipboard!");
            }
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') str = JSON.stringify(str);
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function showError(msg) {
            document.getElementById('docsContent').innerHTML = `
                <div style="padding:40px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;color:#fca5a5;">
                    <h3>Oops! Terjadi Kesalahan</h3>
                    <p>${msg}</p>
                </div>
            `;
        }

        // Init
        document.addEventListener("DOMContentLoaded", () => {
            const baseUrl = window.location.origin;
            const el = document.getElementById('baseUrlText');
            if (el) el.innerText = baseUrl;
            fetchDocs();
        });
    </script>
</body>
</html>
